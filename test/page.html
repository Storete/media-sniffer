<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Media Sniffer 页面捕获测试</title>
<style>
  body { font: 14px/1.7 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #1f2328; }
  h1 { font-size: 18px; }
  .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  button { padding: 7px 14px; margin-right: 8px; border: 1px solid #d1d5db; border-radius: 7px; background: #fff; cursor: pointer; font-size: 13px; }
  button:hover { border-color: #93c5fd; background: #eff6ff; color: #1d4ed8; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  pre { background: #0f172a; color: #cbd5e1; padding: 12px 14px; border-radius: 8px; font-size: 12px; min-height: 120px; white-space: pre-wrap; }
  .ok { color: #15803d; } .bad { color: #b91c1c; }
  video { width: 320px; border-radius: 8px; background: #000; margin-top: 10px; }
  ol { padding-left: 20px; } li { margin: 4px 0; }
</style>
</head>
<body>
<h1>页面内捕获测试</h1>

<div class="card">
  <b>怎么用</b>
  <ol>
    <li>确认扩展已加载，并且在 <code>chrome://extensions</code> 里点过一次刷新</li>
    <li>点下面的按钮 —— 这里模拟的正是 Telegram 的做法：数据先进 Blob / MSE，再交给 <code>&lt;video&gt;</code></li>
    <li>点浏览器工具栏的扩展图标 → 切到「视频」分类</li>
    <li>应该能看到 <b>页面视频 · mp4</b> 条目，点「保存」</li>
  </ol>
</div>

<div class="card">
  <button id="blobTest" class="primary">测试 1：Blob 捕获</button>
  <button id="mseTest">测试 2：MSE 捕获</button>
  <button id="probe">检查 hook 状态</button>
  <div><video id="v" controls></video></div>
</div>

<pre id="log">就绪。</pre>

<script>
const logEl = document.getElementById("log");
const v = document.getElementById("v");
const lines = [];
function log(msg, cls) {
  const t = new Date().toLocaleTimeString();
  lines.push(`[${t}] ${msg}`);
  logEl.innerHTML = lines.map((l) => (l.includes("✗") ? `<span class="bad">${l}</span>` : l)).join("\n");
}

// 测试 1：模拟 Telegram —— 完整文件拿到后 createObjectURL
document.getElementById("blobTest").onclick = async () => {
  log("① 获取测试视频…");
  let blob;
  try {
    const r = await fetch("https://www.w3schools.com/html/mov_bbb.mp4");
    if (!r.ok) throw new Error("HTTP " + r.status);
    blob = await r.blob();
    log(`   拿到 ${(blob.size / 1024).toFixed(0)} KB，type=${blob.type || "(空)"}`);
  } catch (e) {
    blob = new Blob([new Uint8Array(300 * 1024)], { type: "video/mp4" });
    log(`   ✗ 网络取不到样例（${e.message}），改用 300KB 合成 blob 验证链路`);
  }
  const objUrl = URL.createObjectURL(blob);
  v.src = objUrl;
  log("② 已调用 URL.createObjectURL → " + objUrl.slice(0, 42) + "…");
  log("③ 现在点扩展图标，应该在「视频」里看到「页面视频 · mp4」");
};

// 测试 2：模拟 MSE 流式播放
document.getElementById("mseTest").onclick = () => {
  if (!window.MediaSource) { log("✗ 当前浏览器不支持 MediaSource"); return; }
  const ms = new MediaSource();
  v.src = URL.createObjectURL(ms);
  ms.addEventListener("sourceopen", () => {
    try {
      const sb = ms.addSourceBuffer('video/mp4; codecs="avc1.42E01E"');
      for (let i = 0; i < 4; i++) {
        try { sb.appendBuffer(new Uint8Array(120 * 1024)); } catch (e) { /* 数据是假的，append 报错属正常 */ }
      }
      log("① 已创建 MediaSource + SourceBuffer 并 append 4 段（每段 120KB）");
      log("② 扩展里应出现「页面视频（录制中）」条目，点保存会拼接成文件");
      log("   注意：这是随机数据，拼出来的 mp4 不能播放，只验证链路");
    } catch (e) {
      log("✗ addSourceBuffer 失败：" + e.message);
    }
  });
};

// 探针
document.getElementById("probe").onclick = () => {
  const hooked = !!window.__MS_SNIFFER_MAIN__;
  log(hooked ? "✓ 页面主世界的 hook 已注入并生效" : "✗ hook 未注入 —— 扩展没加载、没刷新，或没有本页的访问权限");
  log("   URL.createObjectURL 是否被包装: " + (/native code/.test(URL.createObjectURL.toString()) ? "否（原生的）" : "是（已包装）"));
  log("   MediaSource.prototype.addSourceBuffer: " + (/native code/.test(MediaSource.prototype.addSourceBuffer.toString()) ? "原生" : "已包装"));
};
</script>
</body>
</html>
