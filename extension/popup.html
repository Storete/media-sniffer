<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>资源嗅探</title>
</head>
<body>
  <header>
    <div class="title">
      <span class="logo">◎</span>
      <div>
        <h1>资源嗅探</h1>
        <div id="site" class="site">—</div>
      </div>
    </div>
    <div class="actions">
      <button id="selectToggle" class="icon-btn" title="批量选择页面内捕获的条目">☑</button>
      <button id="saveAll" class="icon-btn" title="把所有页面内捕获的视频/音频交给页面保存">⇩</button>
      <button id="blockSite" class="icon-btn" title="屏蔽此站（不再显示本页资源）">🚫</button>
      <button id="reload" class="icon-btn" title="重新载入页面以捕获全部资源">⟳</button>
      <button id="clear" class="icon-btn" title="清空当前列表">🗑</button>
    </div>
  </header>

  <nav id="chips" class="chips"></nav>

  <!-- 焦点提示条：页面在查看器里打开某条消息时，列表只显示那条的媒体。
       必须给一个显眼的出口，否则用户会以为「别的图片丢了」。 -->
  <div id="focusBar" class="focus-bar hidden">
    <span id="focusText">只看当前打开的那一条</span>
    <button id="focusExit" class="btn-txt tint-blue">显示全部</button>
  </div>

  <main id="list" class="list">
    <div class="empty">正在读取…</div>
  </main>

  <div id="batchBar" class="batch-bar hidden">
    <label class="sel-all"><input id="selAllBox" type="checkbox" /> 全选</label>
    <button id="selInv" class="btn-txt">反选</button>
    <span id="selCount" class="sel-count">已选 0 项</span>
    <button id="selSave" class="btn-txt tint-blue" disabled>保存所选</button>
    <button id="selDone" class="btn-txt">完成</button>
  </div>

  <div id="preview" class="preview hidden">
    <button id="previewClose" class="icon-btn preview-close" title="关闭预览">✕</button>
    <div id="previewBody"></div>
  </div>

  <footer>
    <div class="row">
      <span id="hostState" class="host pill">检测本地下载器…</span>
      <label class="opt" title="并发分片数，越大越快">
        并发
        <input id="concurrency" type="number" min="1" max="64" value="16" />
      </label>
      <button id="openOut" class="btn-txt tint-blue" title="打开文件存放处">打开文件夹</button>
      <button id="historyBtn" class="btn-txt tint-green" title="下载记录（关浏览器自动清空）">下载记录</button>
      <span id="hint" class="hint"></span>
    </div>
    <div id="history" class="history hidden"></div>
    <div id="jobs" class="jobs"></div>
  </footer>

  <script src="hls-family.js"></script>
  <script src="naming.js"></script>
  <script src="popup.js"></script>
</body>
</html>
