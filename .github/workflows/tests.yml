name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  js:
    name: JS 单元测试
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 纯 Node 脚本（vm 沙箱 + 假宿主），不需要 npm install
      # 名称里的项数只是参考，真实数字以脚本自己打印的「通过 N 项」为准；
      # 改了测试记得同步，否则 CI 面板会骗人。
      - name: main-hook（195 项）
        run: node test/main-hook.test.js

      # background 末尾会 require 三个子回归：review（R1~R4 共 27 项）、
      # group_key（G1~G4 共 23 项）、focus_scope（F1~F3 共 20 项），
      # 所以这里的数字包含三批。这三个文件都不能单独跑，直接跑只会打印一行说明。
      - name: background（266 项，含 review 27 + group_key 25 + focus_scope 20）
        run: node test/background.test.js

      - name: range_parallel（14 项）
        run: node test/range_parallel.test.js

      - name: detect（30 项）
        run: node test/detect.test.js

      - name: pattern_sync（4 项）
        run: node test/pattern_sync.test.js

      - name: popup_wiring（47 项）
        run: node test/popup_wiring.test.js

      # 进度卡与阶段文案（1.3.38 起）：防止界面上出现「与播放进度无关」这类解释性废话
      # B29 右键菜单（1.3.59 起）：注册/点击处理/blob 降级/命名（19 项）+
      # 页面侧元素解析器 currentSrc/srcset/picture/懒加载/背景图（16 项）
      - name: context_menu（19 项）
        run: node test/context_menu.test.js

      - name: ctx_pick（16 项）
        run: node test/ctx_pick.test.js

      - name: ui_card（39 项）
        run: node test/ui_card.test.js

      # 图标/噪声过滤（1.3.40 起）：6 条 URL 判据 + 真封面误杀回归
      - name: icon_filter（20 项）
        run: node test/icon_filter.test.js

      # blob 条目取舍（1.3.41 起）：有真实直链才隐藏 blob，且绝不删 m\d+
      - name: blob_item（18 项）
        run: node test/blob_item.test.js

      # 架构约束：通用层不许出现站点专属判断（防模块化回退成 if 汤）
      - name: site_registry（103 项）
        run: node test/site_registry.test.js

      - name: 语法检查
        run: |
          for f in extension/*.js; do
            node --check "$f" || exit 1
          done

  python:
    name: 宿主侧测试（${{ matrix.os }} / py${{ matrix.python }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 只依赖标准库，不需要 pip install
      - name: 语法检查
        run: python -m compileall -q native-host test tools

      # -r 让 -m unittest 能发现 test/ 下的子目录模块
      # 只跑不依赖本机条件的套件；见下方「跳过」说明
      - name: 运行测试
        run: python test/run_all.py

      # 变异测试当门禁：固定 seed 保证可复现，2000 轮约 2 秒。
      # 这几条不变量曾抓到「超长扩展名返回 301 字符」这类单测覆盖不到的缺陷，
      # 放在 CI 里是为了防止以后退回去。
      - name: 变异测试（固定 seed 门禁）
        run: python tools/fuzz_host.py --rounds 2000 --seed 1

      # 规则库门禁（1.3.57 起）：docs/compatibility/ 里每条「已启用」的案例
      # 必须解析出指向 test/ 下真实文件的测试引用（PRODUCT-PLAN L4 判据）。
      # 只查「有『测试』两个字」等于没查（d-052/d-058 的假绿教训），所以要验存在性。
      # 空库绿（不因「还没攒够案例」卡提交）；门禁自身的反向验证在
      # test/compat_gate_test.py，随上面的「运行测试」一起跑。
      - name: 规则库门禁（每条启用规则必须有测试引用）
        run: python tools/check_compat_rules.py
